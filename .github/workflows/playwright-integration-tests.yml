name: Playwright Integration Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        timeout-minutes: 10
      - name: Install mkcert
        run: sudo apt install mkcert
      - name: Generate certs
        run: mkdir -p .dev/certs/ && mkcert -key-file .dev/certs/localhost-key.pem -cert-file .dev/certs/localhost.pem localhost
      - name: Install local certs
        run: mkcert -install
      - name: Setup api env vars
        run: cp .example.env .env
      - name: Run Playwright tests
        run: npx nx run web-e2e:e2e
