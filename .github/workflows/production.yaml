name: promote production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-promote
  cancel-in-progress: false

env:
  username: cfu288

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.promote.outputs.version }}
      revision: ${{ steps.promote.outputs.revision }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
        with:
          version: v0.36.1

      - name: Log in to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.username }}
          password: ${{ secrets.registry_password }}

      - name: Promote staging images
        id: promote
        run: |
          set -euo pipefail
          version=$(git show -s --format=%cs HEAD | tr '-' '.')

          digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -er '.digest'
          }
          app=$(digest "cfu288/mere-medical:sha-$GITHUB_SHA")
          demo=$(digest "cfu288/mere-medical:sha-$GITHUB_SHA-demo")
          docs=$(digest "cfu288/mere-medical-docs:sha-$GITHUB_SHA")
          echo "Promoting $GITHUB_SHA as $version: app=$app demo=$demo docs=$docs"

          docker buildx imagetools create \
            -t cfu288/mere-medical:latest \
            -t "cfu288/mere-medical:$version" \
            "cfu288/mere-medical@$app"
          docker buildx imagetools create \
            -t cfu288/mere-medical:latest-demo \
            -t "cfu288/mere-medical:$version-demo" \
            "cfu288/mere-medical@$demo"
          docker buildx imagetools create \
            -t cfu288/mere-medical-docs:latest \
            "cfu288/mere-medical-docs@$docs"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  release:
    runs-on: ubuntu-latest
    needs: promote
    permissions:
      contents: write
    steps:
      - name: Create a GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ needs.promote.outputs.version }}
          name: Release ${{ needs.promote.outputs.version }}
          commit: ${{ needs.promote.outputs.revision }}
          makeLatest: true
          allowUpdates: true
