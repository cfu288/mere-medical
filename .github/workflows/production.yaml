name: promote production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-promote
  cancel-in-progress: false

env:
  username: cfu288

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.promote.outputs.version }}
      revision: ${{ steps.promote.outputs.revision }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: v0.36.1

      - name: Log in to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.username }}
          password: ${{ secrets.registry_password }}

      - name: Promote staging images
        id: promote
        run: |
          set -euo pipefail

          digest() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -er '.digest'
          }
          config() {
            docker buildx imagetools inspect "$1" --format '{{json .Image}}'
          }
          label() {
            jq -r --arg key "$2" '(.["linux/amd64"] // .).config.Labels[$key] // empty' <<<"$1"
          }

          app_digest=$(digest cfu288/mere-medical:beta)
          demo_digest=$(digest cfu288/mere-medical:beta-demo)
          docs_digest=$(digest cfu288/mere-medical-docs:beta)
          echo "Pinned digests: app=$app_digest demo=$demo_digest docs=$docs_digest"

          app_config=$(config "cfu288/mere-medical@$app_digest")
          demo_config=$(config "cfu288/mere-medical@$demo_digest")
          docs_config=$(config "cfu288/mere-medical-docs@$docs_digest")

          version=$(label "$app_config" org.opencontainers.image.version)
          revision=$(label "$app_config" org.opencontainers.image.revision)
          demo_revision=$(label "$demo_config" org.opencontainers.image.revision)
          docs_revision=$(label "$docs_config" org.opencontainers.image.revision)

          if ! [[ "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "Refusing to promote: app image version label is '$version', expected CalVer. Run a staging build first."
            exit 1
          fi
          if ! [[ "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Refusing to promote: app image revision label is '$revision', expected a full commit sha."
            exit 1
          fi
          if [[ "$demo_revision" != "$revision" || "$docs_revision" != "$revision" ]]; then
            echo "Refusing to promote a mixed set: app=$revision demo=$demo_revision docs=$docs_revision. Wait for the latest staging run to finish green."
            exit 1
          fi
          docker buildx imagetools create \
            -t cfu288/mere-medical:latest \
            -t "cfu288/mere-medical:$version" \
            "cfu288/mere-medical@$app_digest"
          docker buildx imagetools create \
            -t cfu288/mere-medical:latest-demo \
            -t "cfu288/mere-medical:$version-demo" \
            "cfu288/mere-medical@$demo_digest"
          docker buildx imagetools create \
            -t cfu288/mere-medical-docs:latest \
            "cfu288/mere-medical-docs@$docs_digest"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  release:
    runs-on: ubuntu-latest
    needs: promote
    permissions:
      contents: write
    steps:
      - name: Create a GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ needs.promote.outputs.version }}
          name: Release ${{ needs.promote.outputs.version }}
          commit: ${{ needs.promote.outputs.revision }}
          makeLatest: true
          allowUpdates: true
