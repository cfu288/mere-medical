name: build production

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  username: cfu288
  PASSWORD: ${{ secrets.registry_password }}

jobs:
  app-multiplatform:
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-22.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Generate CalVer env var
        run: echo "RELEASE_CALVER_VERSION=$(echo $(date '+%Y.%m.%d'))" >> $GITHUB_ENV

      - name: Get app version
        id: version
        run: echo "version=$(git describe --tags)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: v0.36.1

      - name: Log in to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ env.username }}
          password: ${{ env.PASSWORD }}

      - name: Build and push by platform
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=app-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          build-args: |
            MERE_APP_VERSION=${{ steps.version.outputs.version }}
          outputs: type=image,name=cfu288/mere-medical,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "RELEASE_CALVER_VERSION=${{ env.RELEASE_CALVER_VERSION }}" >> /tmp/digests/version.txt

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  app-manifest:
    runs-on: ubuntu-latest
    needs:
      - app-multiplatform
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: app-digests-*
          merge-multiple: true

      - name: Set CalVer from artifact
        run: |
          echo "RELEASE_CALVER_VERSION=$(cat /tmp/digests/version.txt | head -n1 | cut -d= -f2)" >> $GITHUB_ENV
          rm /tmp/digests/version.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: v0.36.1

      - name: Log in to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ env.username }}
          password: ${{ env.PASSWORD }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t cfu288/mere-medical:latest \
            -t cfu288/mere-medical:${{ env.RELEASE_CALVER_VERSION }} \
            $(printf 'cfu288/mere-medical@sha256:%s ' *)

      - name: Create a GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ env.RELEASE_CALVER_VERSION }}
          name: Release ${{ env.RELEASE_CALVER_VERSION }}
          makeLatest: true
          allowUpdates: true

  app-demo:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Generate CalVer env var
        run: echo "RELEASE_CALVER_VERSION=$(date '+%Y.%m.%d')" >> $GITHUB_ENV

      - name: Get app version
        id: version
        run: echo "version=$(git describe --tags)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: v0.36.1

      - name: Log in to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ env.username }}
          password: ${{ env.PASSWORD }}

      - name: Build and push demo
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=app-demo
          cache-to: type=gha,mode=max,scope=app-demo
          build-args: |
            IS_DEMO=enabled
            MERE_APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            cfu288/mere-medical:latest-demo
            cfu288/mere-medical:${{ env.RELEASE_CALVER_VERSION }}-demo

  docs:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          version: v0.36.1

      - name: Log in to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ env.username }}
          password: ${{ env.PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          file: Dockerfile-docs
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=docs
          cache-to: type=gha,mode=max,scope=docs
          tags: cfu288/mere-medical-docs:latest
