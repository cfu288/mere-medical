spec:
  name: mere-medical
  services:
    - dockerfile_path: Dockerfile
      name: app
      git:
        branch: main
        repo_clone_url: https://github.com/cfu288/mere-medical.git
      envs:
        - key: ONPATIENT_CLIENT_ID
          scope: RUN_TIME
        - key: ONPATIENT_CLIENT_SECRET
          scope: RUN_TIME
        - key: EPIC_CLIENT_ID_R4
          scope: RUN_TIME
        - key: EPIC_SANDBOX_CLIENT_ID_R4
          scope: RUN_TIME
        - key: EPIC_CLIENT_ID
          scope: RUN_TIME
        - key: EPIC_CLIENT_ID_DSTU2
          scope: RUN_TIME
        - key: EPIC_SANDBOX_CLIENT_ID
          scope: RUN_TIME
        - key: EPIC_SANDBOX_CLIENT_ID_DSTU2
          scope: RUN_TIME
        - key: CERNER_CLIENT_ID
          scope: RUN_TIME
        - key: VERADIGM_CLIENT_ID
          scope: RUN_TIME
        - key: VA_CLIENT_ID
          scope: RUN_TIME
        - key: HEALOW_CLIENT_ID
          scope: RUN_TIME
        - key: HEALOW_CLIENT_SECRET
          scope: RUN_TIME
        - key: APP_KEY
          scope: RUN_TIME
        - key: APP_CONTACT
          scope: RUN_TIME
        - key: ALLOW_PUBLIC_CONFIDENTIAL_CLIENTS
          scope: RUN_TIME
        - key: PUBLIC_URL
          value: ${APP_URL}
